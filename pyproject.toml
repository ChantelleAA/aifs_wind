[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aifs-wind-forecast"
version = "1.0.0"
description = "AIFS Wind Forecast Evaluation for Irish Locations"
readme = "README.MD"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Chantelle", email = "chantelle@example.com"}
]

dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "xarray>=0.19.0",
    "cfgrib>=0.9.10",
    "cartopy>=0.20.0",
    "ecmwf-opendata>=0.2.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/yourusername/aifs-wind-forecast"
Repository = "https://github.com/yourusername/aifs-wind-forecast.git"

[tool.setuptools]
packages = ["aifs_wind"]
package-dir = {"" = "src"}

[tool.black]
line-length = 88
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
